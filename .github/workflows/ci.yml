name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: envai
          POSTGRES_PASSWORD: ci_placeholder_password
          POSTGRES_DB: envai_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U envai -d envai_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://envai:ci_placeholder_password@localhost:5433/envai_test
      SECRET_KEY: ci-placeholder-secret-key-for-tests-only-32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r backend/requirements.lock
      - run: pytest -q
        working-directory: backend
      - run: alembic upgrade head
        working-directory: backend
      - run: pip install pip-audit bandit
      - run: pip-audit -r backend/requirements.lock
      - run: bandit -q -r backend/app -ll

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
